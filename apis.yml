aid: ring-therapeutics
name: Ring Therapeutics
description: 'Ring Therapeutics is a Cambridge, Massachusetts biotechnology company
  founded by Flagship Pioneering that develops targeted vector conjugate medicines
  built on the human commensal virome. Its Anellogy platform harnesses anelloviruses
  — commensal viruses that co-exist with the human immune system — to generate gene
  delivery vectors with tissue-specific tropism and the potential to be redosed. Ring
  has sequenced thousands of anelloviruses into what it describes as the largest anellovirus
  database assembled to date, and has raised more than $250 million across Series A,
  B and C financings. The company is a therapeutics developer rather than a software
  provider: it publishes a corporate site, a press release stream and a scientific
  publications list, and operates no public API, developer portal or SDK.'
